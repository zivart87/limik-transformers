            - generic [ref=e256]:
              - blockquote [ref=e257]: "“It’s a system of checks and balances. As we grow and try to do different things to be more profitable with our projects, we can go back and check our work. Before, there were no checks and balances with our old system. But now, everything is digital, so there’s a digital trail that we can track to help us learn and improve. That’s one of the primary benefits of T3: checks and balances.”"
