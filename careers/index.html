  <style>

    /* ═══════════════════════════════
       HERO WORD REVEAL
    ═══════════════════════════════ */
    @keyframes wordReveal {
      from { transform: translateY(115%); }
      to   { transform: translateY(0%); }
    }
    .word-wrap {
      display: inline-block;
      overflow: hidden;
      vertical-align: bottom;
    }
    .split-word {
      display: inline-block;
      transform: translateY(115%);
    }
    .co-hero .split-word {
      animation: wordReveal 0.80s cubic-bezier(0.22,1,0.36,1) forwards;
    }

    /* ═══════════════════════════════
       HERO
    ═══════════════════════════════ */
    .co-hero {
      position: relative;
      min-height: 100vh;
      background: var(--navy-dark);
      overflow: hidden;
      display: flex; align-items: flex-end;
      padding-top: 128px;
    }
    @keyframes bgEnter {
      0%   { opacity: 0; transform: scale(1.07); }
      100% { opacity: 1; transform: scale(1.0); }
    }
    .co-hero-img {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover; object-position: center 35%;
      animation: bgEnter 1.4s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
    }
    .co-hero-overlay {
      position: absolute; inset: 0;
      background: linear-gradient(
        105deg,
        rgba(9,25,59,0.92) 0%,
        rgba(9,25,59,0.65) 50%,
        rgba(9,25,59,0.20) 100%
      );
    }
    .co-hero-content {
      position: relative; z-index: 2;
      width: 100%; padding: 0 60px 152px;
    }
    .co-hero h1 {
      font-size: 72px;
      font-weight: 800; line-height: 0.90;
      text-transform: uppercase; letter-spacing: -0.02em;
      color: var(--white); margin-bottom: 24px; max-width: 960px;
    }
    @media (max-width: 768px) {
      .co-hero-content { padding: 0 24px 140px; }
      .co-hero h1 { font-size: 46px; }
    }

    /* ═══════════════════════════════
       INTRO PANEL
    ═══════════════════════════════ */
    .co-intro {
      position: relative; z-index: 5;
      margin-top: -96px;
      overflow: visible;
      margin-bottom: 320px;
    }
    .co-intro::before {
      content: '';
      position: absolute; inset: 0;
      right: 38%;
      background: var(--navy-dark);
      z-index: 0;
    }
    .co-intro .container {
      position: relative; z-index: 1;
    }
    .co-intro-photo {
      position: absolute;
      right: 48px;
      left: 52%;
      bottom: -320px;
      height: 560px;
      z-index: 2;
      overflow: hidden;
      box-shadow: 0 16px 50px rgba(0,0,0,0.18);
    }
    .co-intro-photo::after {
      content: ''; position: absolute; inset: 0;
      background: rgba(9,25,59,0.07); pointer-events: none;
    }
    .co-intro-photo img {
      position: absolute; inset: 0;
      width: 100%; height: 120%;
      object-fit: cover; object-position: center;
      top: -10%;
    }
    .co-intro-inner {
      width: 62%;
      padding: 132px 0;
    }
    .co-intro-inner h2 {
      font-size: 52px; font-weight: 700;
      letter-spacing: -0.01em; line-height: 1.1;
      color: var(--white); margin: 0 0 28px;
      max-width: 500px;
    }
    .co-intro-inner p {
      font-size: 16px; font-weight: 400; line-height: 1.75;
      color: rgba(255,255,255,0.72); margin: 0 0 40px;
      max-width: 500px;
    }
    @media (max-width: 900px) {
      .co-intro::before { right: 0; }
      .co-intro-inner { width: 100%; padding: 48px 0; }
      .co-intro-photo { display: none; }
      .co-intro { margin-bottom: 0; }
      .co-intro-inner h2 { font-size: 36px; }

<script>
  // Hero h1 word clip-reveal
  (function () {
    document.querySelectorAll('.co-hero h1').forEach(h1 => {
      const nodes = Array.from(h1.childNodes);
      h1.innerHTML = '';
      let wordIndex = 0;
      nodes.forEach(node => {
        if (node.nodeType === 3) {
          node.textContent.split(/(\s+)/).forEach(part => {
            if (/^\s+$/.test(part)) {
              h1.appendChild(document.createTextNode(part));
            } else if (part) {
              const wrap = document.createElement('span');
              wrap.className = 'word-wrap';
              const span = document.createElement('span');
              span.className = 'split-word';
              span.style.animationDelay = (wordIndex * 0.09) + 's';
              span.textContent = part;
              wordIndex++;
              wrap.appendChild(span);
              h1.appendChild(wrap);
            }
          });
        } else if (node.nodeName === 'BR') {
          h1.appendChild(document.createElement('br'));
        }
      });
    });
  })();
</script>

<script src="https://unpkg.com/lenis@1.3.4/dist/lenis.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script>
  gsap.registerPlugin(ScrollTrigger);
  const lenis = new Lenis();
  lenis.on('scroll', ScrollTrigger.update);
  gsap.ticker.add((time) => { lenis.raf(time * 1000); });
  gsap.ticker.lagSmoothing(0);

  const introPhoto = document.querySelector('.co-intro-photo img');
  if (introPhoto) {
    gsap.fromTo(introPhoto,
      { yPercent: -6 },
      {
        yPercent: 6,
        ease: 'none',
        scrollTrigger: {
          trigger: '.co-intro-photo',
          start: 'top bottom',
          end: 'bottom top',
          scrub: 1.5
        }
      }
    );
  }
</script>
