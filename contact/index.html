    /* ═══════════════════════════════
       HERO
    ═══════════════════════════════ */
    .co-hero {
      position: relative;
      min-height: 100vh;
      background: var(--navy-dark);
      overflow: hidden;
      display: flex; align-items: flex-end;
      padding-top: 128px;
    }
    @keyframes bgEnter {
      0%   { opacity: 0; transform: scale(1.07); }
      100% { opacity: 1; transform: scale(1.0); }
    }
    @keyframes wordReveal {
      from { transform: translateY(115%); }
      to   { transform: translateY(0%); }
    }
    .word-wrap {
      display: inline-block;
      overflow: hidden;
      vertical-align: bottom;
    }
    .split-word {
      display: inline-block;
      transform: translateY(115%);
    }
    .co-hero .split-word {
      animation: wordReveal 0.80s cubic-bezier(0.22,1,0.36,1) forwards;
    }
    .co-hero-img {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover; object-position: center 35%;
      animation: bgEnter 1.4s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
    }
    .co-hero-overlay {
      position: absolute; inset: 0;
      background: linear-gradient(
        105deg,
        rgba(9,25,59,0.92) 0%,
        rgba(9,25,59,0.65) 50%,
        rgba(9,25,59,0.20) 100%
      );
    }
    .co-hero-content {
      position: relative; z-index: 2;
      width: 100%; padding: 0 60px 152px;
    }
    .co-hero h1 {
      font-size: 72px;
      font-weight: 800; line-height: 0.90;
      text-transform: uppercase; letter-spacing: -0.02em;
      color: var(--white); margin-bottom: 0; max-width: 960px;
    }

    @media (max-width: 768px) {
      .co-hero-content { padding: 0 24px 60px; }
      .co-hero h1 { font-size: 46px; }
    }

  </style>
