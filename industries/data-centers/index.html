    /* ═══════════════════════════════
       HERO — full-bleed фото, как на главной (hero-slide)
    ═══════════════════════════════ */
    .ind-hero {
      position: relative;
      height: 100vh;
      min-height: 580px;
      overflow: hidden;
      background: var(--navy-dark);
      display: flex;
      align-items: flex-end;
    }
    .ind-hero-bg {
      position: absolute; inset: 0; z-index: 0;
      background-image: url('../../assets/images/ind-data-centers.webp');
      background-size: cover; background-position: center;
      background-color: #0A1628;
      opacity: 0;
      transform: scale(1.07);
      animation: indBgEnter 1.4s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
    }
    @keyframes indBgEnter {
      0%   { opacity: 0; transform: scale(1.07); }
      100% { opacity: 1; transform: scale(1.0); }
    }
    .ind-hero-overlay {
      position: absolute; inset: 0; z-index: 1;
      background: linear-gradient(
        to right,
        rgba(9,25,59,0.92) 0%,
        rgba(9,25,59,0.65) 55%,
        rgba(9,25,59,0.22) 100%
      );
    }
    .ind-hero-content {
      position: relative; z-index: 2;
      width: 100%;
      padding: 0 60px 80px;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 60px;
    }
    .ind-hero-text { flex: 1; max-width: 860px; }
    .ind-hero-action { flex-shrink: 0; padding-bottom: 4px; }

    @keyframes indHeroUp {
      from { opacity: 0; transform: translateY(32px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .ind-hero-text > * { opacity: 0; animation: indHeroUp 0.70s cubic-bezier(0.22,1,0.36,1) forwards; }
    .ind-hero-text > h1 { animation-delay: 0.15s; }
    .ind-hero-text > .ind-hero-sub { animation-delay: 0.55s; }
    .ind-hero-action { opacity: 0; animation: indHeroUp 0.65s cubic-bezier(0.22,1,0.36,1) forwards; animation-delay: 0.55s; }

    .ind-hero h1 {
      font-size: clamp(40px, 5.5vw, 84px);
      font-weight: 600; line-height: 0.90;
      text-transform: uppercase; letter-spacing: -0.02em;
      color: var(--white); margin-bottom: 24px;
    }
    .ind-hero-sub {
      font-size: 17px; font-weight: 400; color: rgba(255,255,255,0.72);
      line-height: 1.65; max-width: 500px; margin-bottom: 0;
    }

    @media (max-width: 991px) {
      .ind-hero-content { padding: 0 40px 72px; gap: 40px; }
      .ind-hero h1 { font-size: clamp(36px, 6vw, 68px); }
    }
    @media (max-width: 768px) {
      .ind-hero { height: 100dvh; }
      .ind-hero-content {
        flex-direction: column;
        align-items: flex-start;
        gap: 28px;
        padding: 0 24px 72px;
      }
      .ind-hero h1 { font-size: 46px; margin-bottom: 16px; }
      .ind-hero-sub { font-size: 15px; }
      .ind-hero-action { width: 100%; }
      .ind-hero-action .btn { width: 100%; justify-content: center; }
    }
