  <style>

    /* ── Страница не использует прозрачный nav ── */
    .nav { border-bottom: 1px solid rgba(9,25,59,0.10); }

    /* ── Основной блок ── */
    .ty-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 160px 40px 100px;
      background: var(--off-white);
    }

    .ty-card {
      max-width: 620px;
      width: 100%;
      text-align: center;
    }

    /* Иконка галочки */
    .ty-icon {
      width: 64px; height: 64px;
      background: var(--blue);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 28px;
    }
    .ty-icon svg { color: var(--white); }

    /* Eyebrow */
    .ty-eyebrow {
      font-size: 13px; font-weight: 800;
      letter-spacing: 0.07em; text-transform: uppercase;
      color: var(--blue); margin-bottom: 20px;
    }

    .ty-card h1 {
      font-size: clamp(40px, 6vw, 80px);
      font-weight: 800; line-height: 0.92;
      letter-spacing: -0.03em;
      color: var(--navy-dark);
      margin-bottom: 24px;
    }

    .ty-card p {
      font-size: 16px; font-weight: 400;
      line-height: 1.75; color: #3A5570;
      margin-bottom: 12px;
    }

    .ty-divider {
      width: 48px; height: 3px;
      background: var(--blue);
      margin: 36px auto;
    }

    /* Что дальше */
    .ty-next {
      display: flex;
      flex-direction: column;
      gap: 12px;
      text-align: left;
      margin-bottom: 48px;
    }
    .ty-next-item {
      display: flex; align-items: flex-start; gap: 14px;
      font-size: 16px; font-weight: 400;
      color: #3A5570; line-height: 1.75;
    }
    .ty-next-num {
      flex-shrink: 0;
      width: 24px; height: 24px;
      background: var(--navy-dark);
      color: var(--white);
      font-size: 11px; font-weight: 800;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin-top: 1px;
    }

    /* Кнопки */
    .ty-actions {
      display: flex; align-items: center; justify-content: center;
    }
    .ty-link {
      display: inline-flex; align-items: center; gap: 16px;
      font-size: 13px; font-weight: 800;
      letter-spacing: 0.07em; text-transform: uppercase;
      color: var(--navy-dark);
    }
    .ty-link-icon {
      display: inline-flex; align-items: center; justify-content: center;
      width: 48px; height: 48px; flex-shrink: 0;
      background: var(--gold); color: var(--navy-dark);
      border-radius: 2px;
    }
    .ty-link-icon svg { transition: transform 0.1s ease; }
    .ty-link:hover .ty-link-icon svg { transform: rotate(-45deg); }

    @media (max-width: 600px) {
      .ty-page { padding: 140px 20px 80px; }
      .ty-actions { flex-direction: column; align-items: flex-start; }
    }

  </style>

        Back to Homepage
